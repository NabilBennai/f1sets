spring:
  datasource:
    url: jdbc:mysql://localhost:3306/f1sets?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50

  cache:
    type: redis
  data:
    redis:
      host: localhost
      port: 6379
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:false}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:false}
  application:
    name: footlinker-api
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:migration


server:
  port: 8080

app:
  jwt:
    secret: Y2hhbmdlLW1lLXN1cGVyLXNlY3JldC0yNTZiaXRzLWFkYXB0ZS1tZWNpc2k=
    expiration: 604800
    refresh-expiration: 2592000
  password-reset:
    expiration: 3600
  frontend-url: ${FRONTEND_URL:http://localhost:4200}
  backend-url: ${BACKEND_URL:http://localhost:8080}
  mail:
    from: ${MAIL_FROM:no-reply@f1sets.local}
  invitations:
    expiration-hours: 168

springdoc:
  swagger-ui.enabled: true
  api-docs.enabled: true

minio:
  url: ${MINIO_URL:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:f1fantasy}
  secret-key: ${MINIO_SECRET_KEY:f1fantasy}
  bucket: f1sets
