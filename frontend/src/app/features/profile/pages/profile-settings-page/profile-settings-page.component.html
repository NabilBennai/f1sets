<section class="flex justify-center px-4 py-4">
  <article
    class="w-full max-w-[860px] rounded-box border border-base-300 bg-base-100 p-6 shadow-sm"
  >
    <h1 class="flex items-center gap-2 text-2xl font-semibold">
      <i class="fa-solid fa-user-gear text-lg text-base-content/70"></i>
      {{ 'profile.settings.title' | translate }}
    </h1>
    <p class="mt-2 text-sm text-base-content/70">
      {{ 'profile.settings.subtitle' | translate }}
    </p>

    <div class="mt-5 flex flex-wrap items-center gap-3">
      @if (avatarUrl) {
        <img
          [src]="avatarUrl"
          [alt]="'profile.common.avatarAltSimple' | translate"
          class="h-20 w-20 rounded-full object-cover"
        />
      } @else {
        <div
          class="flex h-20 w-20 items-center justify-center rounded-full bg-base-300 text-xl font-bold"
        >
          ?
        </div>
      }
      <label class="btn btn-outline btn-sm cursor-pointer">
        <i class="fa-solid fa-image text-[11px]"></i>
        {{
          uploading
            ? ('profile.settings.uploadingPicture' | translate)
            : ('profile.settings.uploadPicture' | translate)
        }}
        <input
          (change)="onAvatarFileSelected($event)"
          accept="image/png,image/jpeg,image/webp"
          hidden
          type="file"
        />
      </label>
    </div>

    <form (ngSubmit)="submit()" [formGroup]="form" class="mt-6 flex flex-col gap-4" novalidate>
      <div class="flex flex-wrap gap-3">
        <label class="flex min-w-[220px] flex-1 flex-col gap-1">
          <span class="text-xs font-medium text-base-content/80">{{
            'profile.common.firstName' | translate
          }}</span>
          <input class="input input-bordered w-full" formControlName="firstName" type="text" />
        </label>
        <label class="flex min-w-[220px] flex-1 flex-col gap-1">
          <span class="text-xs font-medium text-base-content/80">{{
            'profile.common.lastName' | translate
          }}</span>
          <input class="input input-bordered w-full" formControlName="lastName" type="text" />
        </label>
      </div>

      <div class="flex flex-wrap gap-3">
        <label class="flex min-w-[220px] flex-1 flex-col gap-1">
          <span class="text-xs font-medium text-base-content/80">{{
            'profile.common.dateOfBirth' | translate
          }}</span>
          <input class="input input-bordered w-full" formControlName="dateOfBirth" type="date" />
        </label>
        <label class="flex min-w-[220px] flex-1 flex-col gap-1">
          <span class="text-xs font-medium text-base-content/80">{{
            'profile.common.country' | translate
          }}</span>
          <input class="input input-bordered w-full" formControlName="country" type="text" />
        </label>
      </div>

      <label class="flex min-w-[220px] flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-base-content/80">{{
          'profile.settings.languagesLabel' | translate
        }}</span>
        <input
          class="input input-bordered w-full"
          formControlName="languages"
          [placeholder]="'profile.settings.languagesPlaceholder' | translate"
          type="text"
        />
      </label>

      <label class="flex min-w-[220px] flex-1 flex-col gap-1">
        <span class="text-xs font-medium text-base-content/80">{{
          'profile.settings.visibilityLabel' | translate
        }}</span>
        <select class="select select-bordered w-full" formControlName="visibility">
          <option value="PRIVATE">{{ 'profile.visibility.private' | translate }}</option>
          <option value="PUBLIC">{{ 'profile.visibility.public' | translate }}</option>
        </select>
      </label>

      @if (errorMessage) {
        <div class="alert alert-error py-2 text-sm">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>{{ errorMessage }}</span>
        </div>
      }
      @if (successMessage) {
        <div class="alert alert-success py-2 text-sm">
          <i class="fa-solid fa-circle-check"></i>
          <span>{{ successMessage }}</span>
        </div>
      }

      <div>
        <button [disabled]="saving || loading" class="btn btn-primary" type="submit">
          <i class="fa-solid fa-floppy-disk text-[11px]"></i>
          {{
            saving ? ('common.saving' | translate) : ('profile.settings.saveProfile' | translate)
          }}
        </button>
      </div>
    </form>
  </article>
</section>
