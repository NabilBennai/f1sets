<section class="auth-shell">
  <article class="panel auth-card">
    <p class="auth-eyebrow">Account Recovery</p>
    <h1>Forgot Password</h1>
    <p class="auth-copy">Enter your account email and we will send a reset link.</p>

    <form (ngSubmit)="submit()" [formGroup]="form" class="auth-form" novalidate>
      <label class="field-group">
        <span>Email</span>
        <input autocomplete="email" class="field" formControlName="email" type="email" />
      </label>

      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p class="auth-success">{{ successMessage }}</p>
      }

      <button [disabled]="loading" class="btn-primary w-full" type="submit">
        {{ loading ? 'Sending...' : 'Send Reset Link' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/auth/login">Back to sign in</a>
    </div>
  </article>
</section>
