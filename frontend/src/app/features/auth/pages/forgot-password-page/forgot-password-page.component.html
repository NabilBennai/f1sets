<section class="flex min-h-[70vh] items-center justify-center px-4 py-6">
  <article
    class="w-full max-w-[460px] rounded-box border border-base-300 bg-base-100 p-6 shadow-sm"
  >
    <h1 class="flex items-center gap-2 text-2xl font-semibold">
      <i class="fa-solid fa-envelope-circle-check text-lg text-base-content/70"></i>
      {{ 'auth.forgotPassword.title' | translate }}
    </h1>
    <p class="mt-2 text-sm text-base-content/70">
      {{ 'auth.forgotPassword.subtitle' | translate }}
    </p>

    <form (ngSubmit)="submit()" [formGroup]="form" class="mt-5 flex flex-col gap-3" novalidate>
      <label class="flex flex-col gap-1">
        <span class="text-xs font-medium text-base-content/80">{{
          'auth.common.email' | translate
        }}</span>
        <input
          autocomplete="email"
          class="input input-bordered w-full"
          formControlName="email"
          type="email"
        />
      </label>

      @if (errorMessage) {
        <div class="alert alert-error py-2 text-sm">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>{{ errorMessage }}</span>
        </div>
      }
      @if (successMessage) {
        <div class="alert alert-success py-2 text-sm">
          <i class="fa-solid fa-circle-check"></i>
          <span>{{ successMessage }}</span>
        </div>
      }

      <button [disabled]="loading" class="btn btn-primary w-full" type="submit">
        <i
          class="fa-solid"
          [class.fa-spinner]="loading"
          [class.fa-spin]="loading"
          [class.fa-paper-plane]="!loading"
        ></i>
        {{
          loading
            ? ('auth.forgotPassword.sending' | translate)
            : ('auth.forgotPassword.sendResetLink' | translate)
        }}
      </button>
    </form>

    <div class="mt-4 text-sm">
      <a class="link link-hover" routerLink="/auth/login">{{
        'auth.common.backToSignIn' | translate
      }}</a>
    </div>
  </article>
</section>
