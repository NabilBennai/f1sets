<section class="flex min-h-[70vh] items-center justify-center px-4 py-6">
  <article
    class="w-full max-w-[460px] rounded-box border border-base-300 bg-base-100 p-6 shadow-sm"
  >
    <h1 class="flex items-center gap-2 text-2xl font-semibold">
      <i class="fa-solid fa-lock text-lg text-base-content/70"></i>
      {{ 'auth.changePassword.title' | translate }}
    </h1>
    <p class="mt-2 text-sm text-base-content/70">
      {{ 'auth.changePassword.subtitle' | translate }}
    </p>

    <form (ngSubmit)="submit()" [formGroup]="form" class="mt-5 flex flex-col gap-3" novalidate>
      <label class="flex flex-col gap-1">
        <span class="text-xs font-medium text-base-content/80">{{
          'auth.common.currentPassword' | translate
        }}</span>
        <input
          autocomplete="current-password"
          class="input input-bordered w-full"
          formControlName="currentPassword"
          type="password"
        />
      </label>

      <label class="flex flex-col gap-1">
        <span class="text-xs font-medium text-base-content/80">{{
          'auth.common.newPassword' | translate
        }}</span>
        <input
          autocomplete="new-password"
          class="input input-bordered w-full"
          formControlName="newPassword"
          type="password"
        />
      </label>

      @if (errorMessage) {
        <div class="alert alert-error py-2 text-sm">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <span>{{ errorMessage }}</span>
        </div>
      }
      @if (successMessage) {
        <div class="alert alert-success py-2 text-sm">
          <i class="fa-solid fa-circle-check"></i>
          <span>{{ successMessage }}</span>
        </div>
      }

      <button [disabled]="loading" class="btn btn-primary w-full" type="submit">
        <i
          class="fa-solid"
          [class.fa-spinner]="loading"
          [class.fa-spin]="loading"
          [class.fa-lock]="!loading"
        ></i>
        {{
          loading
            ? ('auth.changePassword.updating' | translate)
            : ('auth.changePassword.updatePassword' | translate)
        }}
      </button>
    </form>
  </article>
</section>
