<section class="auth-shell">
  <article class="panel auth-card">
    <p class="auth-eyebrow">Account Security</p>
    <h1>Change Password</h1>
    <p class="auth-copy">Update your password to keep your account protected.</p>

    <form (ngSubmit)="submit()" [formGroup]="form" class="auth-form" novalidate>
      <label class="field-group">
        <span>Current Password</span>
        <input
          autocomplete="current-password"
          class="field"
          formControlName="currentPassword"
          type="password"
        />
      </label>

      <label class="field-group">
        <span>New Password</span>
        <input
          autocomplete="new-password"
          class="field"
          formControlName="newPassword"
          type="password"
        />
      </label>

      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p class="auth-success">{{ successMessage }}</p>
      }

      <button [disabled]="loading" class="btn-primary w-full" type="submit">
        {{ loading ? 'Updating...' : 'Update Password' }}
      </button>
    </form>
  </article>
</section>
