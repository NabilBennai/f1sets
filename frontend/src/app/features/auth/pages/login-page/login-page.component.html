<section class="auth-shell">
  <article class="panel auth-card">
    <p class="auth-eyebrow">Welcome Back</p>
    <h1>Sign in to F1 Sets</h1>
    <p class="auth-copy">Access your setup profile and secure account tools.</p>

    <form (ngSubmit)="submit()" [formGroup]="form" class="auth-form" novalidate>
      <label class="field-group">
        <span>Email</span>
        <input autocomplete="email" class="field" formControlName="email" type="email" />
      </label>

      <label class="field-group">
        <span>Password</span>
        <input
          autocomplete="current-password"
          class="field"
          formControlName="password"
          type="password"
        />
      </label>

      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }

      <button [disabled]="loading" class="btn-primary w-full" type="submit">
        {{ loading ? 'Signing In...' : 'Sign In' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/auth/forgot-password">Forgot password?</a>
      <a routerLink="/auth/register">Create account</a>
    </div>
  </article>
</section>
