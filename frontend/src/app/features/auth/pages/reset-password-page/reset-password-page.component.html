<section class="auth-shell">
  <article class="panel auth-card">
    <p class="auth-eyebrow">Secure Reset</p>
    <h1>Reset Password</h1>
    <p class="auth-copy">Use your email token and choose a new password.</p>

    <form (ngSubmit)="submit()" [formGroup]="form" class="auth-form" novalidate>
      <label class="field-group">
        <span>Reset Token</span>
        <input autocomplete="off" class="field" formControlName="token" type="text" />
      </label>

      <label class="field-group">
        <span>New Password</span>
        <input
          autocomplete="new-password"
          class="field"
          formControlName="newPassword"
          type="password"
        />
      </label>

      @if (errorMessage) {
        <p class="auth-error">{{ errorMessage }}</p>
      }
      @if (successMessage) {
        <p class="auth-success">{{ successMessage }}</p>
      }

      <button [disabled]="loading" class="btn-primary w-full" type="submit">
        {{ loading ? 'Resetting...' : 'Reset Password' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/auth/login">Back to sign in</a>
    </div>
  </article>
</section>
