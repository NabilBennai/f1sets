<div class="relative">
  <div class="join w-full">
    <input
      [disabled]="disabled"
      [ngModel]="value"
      (blur)="handleBlur()"
      (focus)="handleFocus()"
      (ngModelChange)="handleInput($event)"
      class="input input-bordered join-item w-full"
      type="text"
      [placeholder]="'shared.trackAutocomplete.placeholder' | translate"
    />
    @if (value && !disabled) {
      <button
        type="button"
        class="btn btn-outline join-item btn-sm"
        (mousedown)="clearValue($event)"
        [attr.aria-label]="'shared.trackAutocomplete.clearAria' | translate"
      >
        <i class="fa-solid fa-xmark text-[11px]"></i>
      </button>
    } @else {
      <span class="btn btn-ghost join-item btn-sm pointer-events-none text-base-content/70"
        ><i class="fa-solid fa-chevron-down text-[11px]"></i
      ></span>
    }
  </div>

  @if (dropdownOpen) {
    <div
      class="absolute left-0 right-0 top-[calc(100%+0.25rem)] z-30 flex max-h-64 flex-col gap-1 overflow-y-auto rounded-box border border-base-300 bg-base-100 p-1 shadow-xl"
    >
      @for (option of filteredOptions; track option) {
        <button
          type="button"
          class="btn btn-ghost btn-sm justify-start"
          (mousedown)="selectOption(option.slug)"
        >
          {{ option.label }}
        </button>
      }
      @if (filteredOptions.length === 0) {
        <p class="px-2 py-1 text-xs text-base-content/70">
          {{ 'shared.trackAutocomplete.empty' | translate }}
        </p>
      }
    </div>
  }
</div>
