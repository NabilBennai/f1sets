<section
  class="toast toast-end z-[1100] max-h-[70vh] overflow-y-auto pr-1"
  aria-live="polite"
  aria-atomic="true"
>
  @if (toasts$ | async; as toasts) {
    @for (toast of toasts; track trackByToastId($index, toast)) {
      <article
        class="alert w-[320px] shadow-md"
        [class.alert-success]="toast.type === 'success'"
        [class.alert-error]="toast.type === 'error'"
        [class.alert-info]="toast.type === 'info'"
      >
        <div class="flex flex-col gap-1">
          <strong class="text-sm">{{ toast.title }}</strong>
          <p class="text-xs opacity-80">{{ toast.message }}</p>
        </div>
        <button type="button" class="btn btn-ghost btn-xs" (click)="dismiss(toast.id)">
          <i class="fa-solid fa-xmark text-[11px]"></i> {{ 'common.close' | translate }}
        </button>
      </article>
    }
  }
</section>
